name: Tests OSINT

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.23'
          python-version: '3.12'
          enable-cache: true
      - name: Installer les dépendances verrouillées
        run: uv sync --locked --group dev
      - name: Tests du collecteur Node
        run: npm test
      - name: Tests du pipeline et des intégrations simulées
        run: uv run --locked python -m pytest -q
      - name: Vérifier les espaces et conflits de patch
        run: git diff --check
